kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # host :8080 -> NodePort 30080 (fulfillops-api-nodeport). Stable during rolling updates,
      # unlike `kubectl port-forward`, which pins to one pod and drops when that pod terminates.
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
