apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fulfillops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Jakub-Tenders/FULFILLOPS.git
    targetRevision: main
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: fulfillops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
