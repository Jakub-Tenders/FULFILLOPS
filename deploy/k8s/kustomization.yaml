apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fulfillops
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - api.yaml
  - worker.yaml
# Schema + seed are copied here by scripts/sync_k8s_sql.sh (kustomize cannot read files outside this dir).
configMapGenerator:
  - name: fulfillops-db-init
    files:
      - 001_schema.sql=sql/001_initial_schema.sql
      - 002_seed.sql=sql/002_seed.sql
generatorOptions:
  disableNameSuffixHash: true
# The image tag is the ONLY thing you change to deploy: set by scripts/k8s_up.sh, committed to Git.
images:
  - name: fulfillops
    newName: fulfillops
    newTag: dcbf3bb
